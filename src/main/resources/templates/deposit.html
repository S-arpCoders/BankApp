<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Deposit Money</title>
    <link href="bootstrap.min.css" rel="stylesheet">
    <link href="transfer.css" rel="stylesheet">

    <style>
        .centred-text {
            text-align: center;
            margin-bottom: 20px;
        }
.error-message {
            color: red;
            font-weight: bold;
        }
.button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
}

    </style>
</head>
<body>
<div class="container mt-5" id="transfer-container">
    <!-- Centered Text Section -->
    <div class="centred-text">
        <h1>Deposit Money into Account</h1>
        <h3 th:classappend="${isError} ? 'error-message' : ''" th:if="${response}" th:text="${response}"></h3>
    </div>

    <!-- No Accounts Message Section -->
    <div th:if="${noAccounts}" class="alert alert-warning text-center" role="alert">
        <h4>You don't have any accounts yet!</h4>
        <p>Please create an account first before making a deposit.</p>
        <a href="/create" class="btn btn-primary mt-2">Create Account</a>
    </div>

    <!-- Form Section - Only show if user has accounts -->
    <form action="#" th:action="@{/deposit}" method="POST" th:unless="${noAccounts}">
        <label class="col-form-label mt-4" for="accNo">Select Account:</label>
        <select class="form-control" id="accNo" name="accNo" required>
            <option value="">-- Select an account --</option>
            <option th:each="account : ${accounts}" th:value="${account.accNo}" 
                    th:text="'Account: ' + ${account.accNo} + ' (Balance: R' + ${account.balance} + ')'"></option>
        </select>

        <label class="col-form-label mt-4" for="amount">Amount to Deposit:</label>
        <div class="input-group mb-3">
            <span class="input-group-text">R</span>
            <input aria-label="Amount (to the nearest rand)" class="form-control" id="amount" min="10.00"
                   name="amount" required type="number">
            <span class="input-group-text">.00</span>
        </div>

        <!-- Buttons Section -->
        <div class="button-group">
            <button class="btn btn-primary" type="submit">Deposit</button>
            <button class="btn btn-secondary" onclick="history.back()" type="button">Go Back</button>
        </div>
    </form>
</div>
</body>
</html>
