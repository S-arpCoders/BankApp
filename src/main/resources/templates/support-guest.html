<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系客服</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .center-card {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: rgba(196, 190, 192, 0.95);
            border-radius: 10px;
            box-shadow: 1px 1px 2rem rgba(0, 0, 0, 0.3);
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .message-box {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            padding: 1.5rem;
            margin: 1rem 0;
        }
        .icon-large {
            font-size: 4rem;
            color: #dc3545;
            margin-bottom: 1rem;
        }
        .btn-custom {
            text-decoration: none;
            padding: 12px 24px;
            background: black;
            color: white;
            border: none;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            display: inline-block;
            margin: 0.5rem;
        }
        .btn-custom:hover {
            background: rgba(196, 190, 192, 0.9);
            color: black;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="center-card">
    <div class="card">
        <div class="container">
            <h1>
                <i class="fas fa-headset" style="width: 30px; height: 30px; vertical-align: middle; margin-right: 8px;"></i>
                联系客服
            </h1>
            <div class="message-box">
                <i class="fas fa-user-lock icon-large"></i>
                <h3 th:text="${message}">请先登录后再联系客服</h3>
                <p>您需要登录账户后才能使用客服支持功能</p>
            </div>
            <div class="button-group">
                <a th:href="@{/login}" class="btn-custom">
                    <i class="fas fa-sign-in-alt"></i> 立即登录
                </a>
                <a th:href="@{/}" class="btn-custom">
                    <i class="fas fa-home"></i> 返回首页
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
