<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>login</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="containers">
    <!-- First container for the register box -->
    <div class="box">
        <div class="content">
<h1>
    <img src="image/log.png" alt="Register Icon"style="width: 30px; height: 30px; vertical-align: middle; margin-right: 8px; color:white; ">
    Log Into your Account</h1>

<h3 th:text="${response}" ></h3>
<div th:if="${remainingAttempts != null}" class="alert alert-warning">
    剩余登录尝试次数: <span th:text="${remainingAttempts}"></span>
</div>
<form action="#" th:action="@{/login}" method="post">
   <!-- <label for="username">Username:</label>-->
    <!--<input type="text" id="username" name="username" required>-->

    <label for="username" class="form-label mt-4">Username</label>
    <input type="text" class="form-control" id="username" name="username" placeholder="Username" autocomplete="off" required>
    <br>
    <label for="password" class="form-label mt-4">Password</label>
    <input type="password" class="form-control" name="password" id="password" placeholder="Password" autocomplete="off" required>

<!--    <label for="password">Password:</label>-->
<!--    <input type="password" id="password" name="password" required>-->
    <br>
    
    <div th:if="${showCaptcha}" id="captchaSection">
        <label for="captcha" class="form-label mt-4">验证码</label>
        <div class="input-group">
            <input type="text" class="form-control" name="captcha" id="captcha" placeholder="请输入验证码" autocomplete="off">
            <img id="captchaImage" src="/captcha" alt="验证码" style="cursor: pointer; border: 1px solid #ccc; margin-left: 10px;" onclick="refreshCaptcha()">
        </div>
        <small class="text-muted">点击图片刷新验证码</small>
        <br>
    </div>
    
    <div class="button-container">
        <!-- Login button -->
        <button type="submit" class="btn">
            <i class="fa fa-sign-in" aria-hidden="true"></i>
            Login
        </button>
        <!-- Register button -->
        <button type="button" class="btn">
            <a href="/register">
                <i class="fa fa-user-plus" aria-hidden="true"></i>
                Register
            </a>
        </button>
</div>
</form>
            </div>
    </div>
</div>

<script>
function refreshCaptcha() {
    var captchaImage = document.getElementById('captchaImage');
    if (captchaImage) {
        captchaImage.src = '/captcha?' + new Date().getTime();
    }
}
</script>

</body>
</html>
