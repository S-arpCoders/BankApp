<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系客服</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: url('image/background.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .center-card {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-card {
            background: rgba(196, 190, 192, 0.95);
            border-radius: 10px;
            box-shadow: 1px 1px 2rem rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            height: 80vh;
            max-height: 650px;
        }

        .card-header {
            background: rgba(65, 59, 60, 0.95);
            color: white;
            padding: 15px 20px;
            border-radius: 10px 10px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-header h3 {
            margin: 0;
            display: flex;
            align-items: center;
            font-size: 1.25rem;
        }

        .card-header h3 i {
            margin-right: 10px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 12px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.875rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            text-decoration: none;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: rgba(248, 249, 250, 0.5);
            display: flex;
            flex-direction: column;
        }

        .message-wrapper {
            margin-bottom: 20px;
            display: flex;
            width: 100%;
        }

        .message-wrapper.user {
            justify-content: flex-end;
        }

        .message-wrapper.support {
            justify-content: flex-start;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin: 0 10px;
        }

        .message-avatar.user {
            background: #413b3c;
            color: white;
            order: 2;
        }

        .message-avatar.support {
            background: rgba(65, 59, 60, 0.8);
            color: white;
        }

        .message-content {
            max-width: 70%;
            display: flex;
            flex-direction: column;
        }

        .message-bubble {
            padding: 12px 18px;
            border-radius: 18px;
            word-wrap: break-word;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .message-wrapper.user .message-bubble {
            background: #413b3c;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message-wrapper.support .message-bubble {
            background: white;
            color: #413b3c;
            border: 1px solid rgba(65, 59, 60, 0.2);
            border-bottom-left-radius: 5px;
        }

        .message-bubble.smart-reply {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
            white-space: pre-line;
        }

        .message-info {
            font-size: 0.75rem;
            color: #666;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .message-wrapper.user .message-info {
            justify-content: flex-end;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-answered {
            background: #d4edda;
            color: #155724;
        }

        .input-area {
            padding: 15px 20px;
            background: rgba(196, 190, 192, 0.95);
            border-radius: 0 0 10px 10px;
            border-top: 1px solid rgba(65, 59, 60, 0.2);
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-group textarea {
            flex: 1;
            border: 2px solid rgba(65, 59, 60, 0.3);
            border-radius: 25px;
            padding: 12px 20px;
            resize: none;
            height: 50px;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.9);
            color: #413b3c;
        }

        .input-group textarea:focus {
            outline: none;
            border-color: #413b3c;
        }

        .input-group textarea::placeholder {
            color: rgba(65, 59, 60, 0.5);
        }

        .send-btn {
            background: #413b3c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .send-btn:hover {
            background: rgba(65, 59, 60, 0.8);
            transform: scale(1.05);
        }

        .success-alert {
            background: #d4edda;
            color: #155724;
            padding: 10px 15px;
            border-radius: 5px;
            margin: 0 20px 10px 20px;
            border: 1px solid #c3e6cb;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            padding: 10px 0;
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            background: #413b3c;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        .welcome-divider {
            text-align: center;
            margin: 10px 0;
            color: rgba(65, 59, 60, 0.5);
            font-size: 0.8rem;
        }

        .welcome-divider::before,
        .welcome-divider::after {
            content: '';
            display: inline-block;
            width: 30px;
            height: 1px;
            background: rgba(65, 59, 60, 0.3);
            margin: 0 10px;
            vertical-align: middle;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(65, 59, 60, 0.3);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(65, 59, 60, 0.5);
        }
    </style>
</head>
<body>

<div class="center-card">
    <div class="main-card">
        <div class="card-header">
            <h3>
                <i class="fas fa-headset"></i>
                在线客服
            </h3>
            <div class="header-buttons">
                <a href="/dashboard" class="header-btn">
                    <i class="fas fa-arrow-left"></i> 返回
                </a>
                <a href="/" class="header-btn">
                    <i class="fas fa-sign-out-alt"></i> 退出
                </a>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message-wrapper support">
                <div class="message-avatar support">
                    <i class="fas fa-headset"></i>
                </div>
                <div class="message-content">
                    <div class="message-bubble">
                        您好，请问您使用银行系统过程中碰到什么问题？
                    </div>
                    <div class="message-info">
                        <span>客服</span>
                    </div>
                </div>
            </div>

            <div th:if="${questions != null and !questions.isEmpty()}" class="welcome-divider">历史记录</div>

            <th:block th:each="question : ${questions}">
                <div class="message-wrapper user">
                    <div class="message-avatar user">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="message-content">
                        <div class="message-bubble" th:text="${question.question}"></div>
                        <div class="message-info">
                            <span th:text="${#temporals.format(question.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                            <span class="status-badge" 
                                  th:classappend="${question.status == 'PENDING'} ? 'status-pending' : 'status-answered'"
                                  th:text="${question.status == 'PENDING'} ? '待回复' : '已回复'"></span>
                        </div>
                    </div>
                </div>

                <div th:if="${question.answer != null}" class="message-wrapper support">
                    <div class="message-avatar support">
                        <i class="fas fa-headset"></i>
                    </div>
                    <div class="message-content">
                        <div class="message-bubble" th:text="${question.answer}"></div>
                        <div class="message-info">
                            <span>客服回复于</span>
                            <span th:text="${#temporals.format(question.answeredAt, 'yyyy-MM-dd HH:mm')}"></span>
                        </div>
                    </div>
                </div>
            </th:block>

            <div th:if="${smartReply != null}" class="message-wrapper support">
                <div class="message-avatar support">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="message-content">
                    <div class="message-bubble smart-reply" th:text="${smartReply}"></div>
                    <div class="message-info">
                        <span><i class="fas fa-robot"></i> 智能客服</span>
                    </div>
                </div>
            </div>

            <div th:if="${autoReply != null}" class="message-wrapper support">
                <div class="message-avatar support">
                    <i class="fas fa-headset"></i>
                </div>
                <div class="message-content">
                    <div class="message-bubble" th:text="${autoReply}"></div>
                    <div class="message-info">
                        <span>客服</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <form action="#" th:action="@{/support}" method="post" id="chatForm">
                <div class="input-group">
                    <textarea name="question" id="questionInput" placeholder="请输入您的问题..." required></textarea>
                    <button type="submit" class="send-btn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var chatContainer = document.getElementById('chatContainer');
        chatContainer.scrollTop = chatContainer.scrollHeight;

        var form = document.getElementById('chatForm');
        var textarea = document.getElementById('questionInput');

        textarea.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (textarea.value.trim()) {
                    form.submit();
                }
            }
        });

        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        form.addEventListener('submit', function(e) {
            if (!textarea.value.trim()) {
                e.preventDefault();
                return;
            }
        });
    });
</script>

</body>
</html>
