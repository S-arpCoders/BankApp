<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系客服</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('/image/opt1.jpg');
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .chat-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            height: 80vh;
            max-height: 700px;
        }
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px 15px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-header h3 {
            margin: 0;
            display: flex;
            align-items: center;
        }
        .chat-header h3 i {
            margin-right: 10px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }
        .message.user {
            align-items: flex-end;
        }
        .message.support {
            align-items: flex-start;
        }
        .message-bubble {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            word-wrap: break-word;
        }
        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }
        .message.support .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 5px;
        }
        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
            padding: 0 5px;
        }
        .chat-input-area {
            padding: 15px 20px;
            background: white;
            border-radius: 0 0 15px 15px;
            border-top: 1px solid #e0e0e0;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        .input-group textarea {
            flex: 1;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            padding: 10px 15px;
            resize: none;
            height: 50px;
            font-size: 14px;
        }
        .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .send-btn:hover {
            transform: scale(1.05);
        }
        .logout-button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.3s;
        }
        .logout-button:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            text-decoration: none;
        }
        .back-button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            margin-right: 10px;
            transition: background 0.3s;
        }
        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            text-decoration: none;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            border: 1px solid #c3e6cb;
        }
        .typing-indicator {
            display: flex;
            padding: 10px;
            align-items: center;
        }
        .typing-indicator span {
            height: 8px;
            width: 8px;
            background: #667eea;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }
        .welcome-message {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .avatar.support {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .avatar.user {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .message-content {
            flex: 1;
            max-width: calc(100% - 60px);
        }
        .status-badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 10px;
            margin-top: 5px;
            display: inline-block;
        }
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        .status-answered {
            background: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="chat-container">
        <div class="chat-header">
            <div style="display: flex; align-items: center;">
                <a href="/dashboard" class="back-button">
                    <i class="fas fa-arrow-left"></i> 返回
                </a>
                <h3>
                    <i class="fas fa-headset"></i>
                    客服支持
                </h3>
            </div>
            <a href="/" class="logout-button d-flex align-items-center">
                <i class="fas fa-sign-out-alt me-2"></i> 退出
            </a>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div th:if="${successMessage}" class="success-message">
                <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
            </div>

            <div class="welcome-message">
                <div class="avatar support">
                    <i class="fas fa-headset"></i>
                </div>
                <div class="message-content">
                    <div class="message-bubble">
                        您好，请问您使用银行系统过程中碰到什么问题？
                    </div>
                    <div class="message-time">客服</div>
                </div>
            </div>

            <div th:each="question : ${questions}">
                <div class="welcome-message" style="justify-content: flex-end;">
                    <div class="message-content" style="text-align: right;">
                        <div class="message-bubble" th:text="${question.question}" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-bottom-right-radius: 5px; display: inline-block; text-align: left;"></div>
                        <div class="message-time">
                            <span th:text="${#temporals.format(question.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                            <span class="status-badge" th:classappend="${question.status == 'PENDING'} ? 'status-pending' : 'status-answered'" th:text="${question.status == 'PENDING'} ? '待回复' : '已回复'"></span>
                        </div>
                    </div>
                    <div class="avatar user" style="margin-left: 10px; margin-right: 0;">
                        <i class="fas fa-user"></i>
                    </div>
                </div>

                <div th:if="${question.answer != null}" class="welcome-message">
                    <div class="avatar support">
                        <i class="fas fa-headset"></i>
                    </div>
                    <div class="message-content">
                        <div class="message-bubble" th:text="${question.answer}"></div>
                        <div class="message-time">客服回复于 <span th:text="${#temporals.format(question.answeredAt, 'yyyy-MM-dd HH:mm')}"></span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <form action="#" th:action="@{/support}" method="post" id="chatForm">
                <div class="input-group">
                    <textarea name="question" id="questionInput" placeholder="请输入您的问题..." required></textarea>
                    <button type="submit" class="send-btn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var chatMessages = document.getElementById('chatMessages');
        chatMessages.scrollTop = chatMessages.scrollHeight;

        var form = document.getElementById('chatForm');
        var textarea = document.getElementById('questionInput');

        textarea.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (textarea.value.trim()) {
                    form.submit();
                }
            }
        });

        form.addEventListener('submit', function(e) {
            if (!textarea.value.trim()) {
                e.preventDefault();
                return;
            }
        });
    });
</script>

</body>
</html>
